<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Sudharshan M, Computer Science and Cybersecurity Undergraduate" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#101C36"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A4373"/>
      <stop offset="1" stop-color="#16233F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8FA3C4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
  </defs>

  <style>
    .name { font: 700 68px "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -1.5px; fill: #E8EEF9; }
    .role { font: 400 25px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #B7C5E0; }
    .skill { font: 600 18px "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8FA3C4; letter-spacing: 0.3px; }
    .trace { fill: none; stroke: #58A6FF; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5 9; animation: flow 2.6s linear infinite; }
    .node { fill: #0A1020; stroke: #58A6FF; stroke-width: 2; }
    .pulse { fill: none; stroke: #F2B84B; stroke-width: 2; transform-origin: 980px 150px; animation: ping 3.2s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.2); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .trace, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- traces running from the shield toward the text -->
    <path class="trace" d="M870 120 H760 L730 90 H640"/>
    <path class="trace" d="M870 170 H760 L732 198 H690"/>
    <path class="trace" d="M890 225 H800 L770 255 H690"/>
    <circle class="node" cx="640" cy="90" r="5"/>
    <circle class="node" cx="690" cy="198" r="5"/>
    <circle class="node" cx="690" cy="255" r="5"/>

    <!-- shield -->
    <path d="M980 38 L1094 80 V172 C1094 238 1044 278 980 304 C916 278 866 238 866 172 V80 Z" fill="url(#shield)" stroke="#4A6DB0" stroke-width="2"/>
    <path d="M980 60 L1074 94 V172 C1074 226 1034 260 980 282 C926 260 886 226 886 172 V94 Z" fill="none" stroke="#4A6DB0" stroke-opacity="0.55" stroke-width="1.2"/>

    <!-- keyhole -->
    <circle class="pulse" cx="980" cy="150" r="16"/>
    <circle cx="980" cy="150" r="16" fill="#F2B84B"/>
    <path d="M971 160 H989 L995 204 H965 Z" fill="#F2B84B"/>

    <!-- text -->
    <text class="name" x="64" y="132">Sudharshan M</text>
    <rect x="66" y="156" width="72" height="4" rx="2" fill="#F2B84B"/>
    <text class="role" x="64" y="208">Computer Science &amp; Cybersecurity Undergraduate</text>

    <g class="skill">
      <rect x="64" y="244" width="9" height="9" fill="#F2B84B"/>
      <text x="84" y="253">Secure software</text>
      <rect x="236" y="244" width="9" height="9" fill="#F2B84B"/>
      <text x="256" y="253">Full-stack development</text>
      <rect x="456" y="244" width="9" height="9" fill="#F2B84B"/>
      <text x="476" y="253">Machine learning</text>
    </g>
  </g>
</svg>
